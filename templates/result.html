<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Calculation Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark shadow">

<div class="container">

<span class="navbar-brand">

<i class="bi bi-calculator-fill"></i>

Engineering Calculator

</span>

</div>

</nav>

<div class="container py-5">

<div class="glass-card">

<div class="text-center">

<i class="bi bi-check-circle-fill display-2 text-success"></i>

<h2 class="mt-3">Calculation Completed</h2>

</div>

<table class="table table-bordered table-dark table-hover mt-4">

<tr>

<th width="40%">Operation</th>

<td>{{ operation }}</td>

</tr>

<tr>

<th>First Number</th>

<td>{{ num1 }}</td>

</tr>

<tr>

<th>Second Number</th>

<td>{{ num2 }}</td>

</tr>

<tr class="table-success">

<th>Answer</th>

<td><strong>{{ result }}</strong></td>

</tr>

</table>

<div class="text-center mt-4">

<a href="/" class="btn btn-primary btn-lg">

<i class="bi bi-arrow-repeat"></i>

New Calculation

</a>

</div>

</div>

</div>

<footer class="text-center text-light py-3">

© 2026 Engineering Calculator

</footer>

</body>

</html>
